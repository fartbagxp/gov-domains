name: Run httpx on CSV files

on:
  workflow_dispatch:
  workflow_call:

jobs:
  find-csv-files:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      csv_files: ${{ steps.set-matrix.outputs.csv_files }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find all CSV files
        id: set-matrix
        run: |
          CSV_FILES=$(find data/csv -name "*.csv" -type f | sed 's|^data/csv/||' | jq -R -s -c 'split("\n")[:-1]')
          echo "csv_files=${CSV_FILES}" >> "$GITHUB_OUTPUT"
          echo "Found CSV files: ${CSV_FILES}"

  process-csv:
    needs: find-csv-files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        csv_file: ${{ fromJson(needs.find-csv-files.outputs.csv_files) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install httpx
        run: |
          # go install reaches out to the module proxy and the checksum DB, so
          # a single transient failure here used to take out the whole matrix leg.
          for attempt in 1 2 3; do
            if go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest; then
              exit 0
            fi
            echo "go install failed (attempt ${attempt}/3); retrying."
            sleep $(( attempt * 15 ))
          done
          echo "Could not install httpx after 3 attempts." >&2
          exit 1

      - name: Verify httpx installation
        run: |
          "$HOME/go/bin/httpx" -version

      - name: Create tech directory
        run: |
          mkdir -p data/tech
          rm -rf data/tech/*

      - name: Process File - ${{ matrix.csv_file }}
        env:
          CSV_FILE: ${{ matrix.csv_file }}
        run: |
          csv_file="data/csv/${CSV_FILE}"
          filename=$(basename "$csv_file" .csv)
          output_file="data/tech/${filename}_httpx.csv"

          echo "Processing $csv_file..."
          # Skip header, extract domain column, and run httpx. -retries makes
          # httpx re-attempt individual hosts that reset the connection instead
          # of recording them as dead.
          < "$csv_file" tail -n +2 | cut -d ',' -f 1 \
            | "$HOME/go/bin/httpx" -nc -title -tech-detect -status-code -csv \
                -retries 2 -timeout 10 -rate-limit 150 > "$output_file"

          # An empty result means the scan failed outright rather than finding
          # nothing; drop it so the previous week's data is kept instead.
          if [ ! -s "$output_file" ] || [ "$(wc -l < "$output_file")" -le 1 ]; then
            echo "httpx produced no rows for $csv_file; discarding so existing data is kept."
            rm -f "$output_file"
            exit 0
          fi

          echo "Completed $csv_file. Results saved to $output_file"

      - name: Upload result as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tech-data-${{ matrix.csv_file }}
          path: data/tech/
          retention-days: 1
          if-no-files-found: ignore

  commit-results:
    needs: process-csv
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create tech directory
        run: mkdir -p data/tech

      - name: Download all tech data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tech-data-*
          path: artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Overlay scanned files onto the checked-out data
        run: |
          # Deliberately NOT clearing data/tech first: a CSV whose httpx scan
          # failed keeps its previous results rather than being deleted.
          mkdir -p artifacts
          cp -R artifacts/. data/tech/ 2>/dev/null || echo "No artifacts to overlay."
          ls -la data/tech/

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          ( cd artifacts && ls ./*.csv 2>/dev/null || true ) \
            | sed 's|^\./|data/tech/|' > /tmp/tech-paths.txt
          cat /tmp/tech-paths.txt

          ./scripts/commit-and-push.sh \
            "Investigating technology stack with httpx - $(date +'%Y-%m-%d')" \
            --paths-from /tmp/tech-paths.txt
