name: Site Update Raw - Weekly

on:
  schedule:
    - cron: "0 1 * * 1"  # Monday 01:00 UTC - full sweep of every domain
    - cron: "0 3 * * 3"  # Wednesday 03:00 UTC - backfill whatever is stale
    - cron: "0 3 * * 5"  # Friday 03:00 UTC - backfill whatever is stale
  workflow_dispatch:
    inputs:
      mode:
        description: "full = every domain, stale = only domains missing or older than the staleness window"
        type: choice
        options: [full, stale]
        default: full
      stale_after_days:
        description: "Age in days past which a domain counts as stale"
        type: string
        default: "4"

concurrency:
  group: pipeline-raw
  cancel-in-progress: false

jobs:
  select-domains:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      domains: ${{ steps.select.outputs.domains }}
      count: ${{ steps.select.outputs.count }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Select domains to fetch
        id: select
        env:
          # The Monday cron does a full sweep; the mid-week crons only revisit
          # domains whose data is missing or stale, so a domain that crt.sh was
          # refusing on Monday gets more chances later in the same week.
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '0 1 * * 1' && 'full' || 'stale') }}
          STALE_AFTER_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.stale_after_days || '4' }}
        run: |
          echo "Mode: ${MODE}"

          if [ "${MODE}" = "full" ]; then
            selected=$(grep -vE '^[[:space:]]*(#|$)' config/domains.txt)
          else
            selected=$(uv run python scripts/fetch_log.py --stale --stale-after-days "${STALE_AFTER_DAYS}")
          fi

          matrix=$(printf '%s' "${selected}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          count=$(printf '%s' "${matrix}" | jq 'length')

          echo "domains=${matrix}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          echo "Selected ${count} domain(s)."

  update-sites-raw:
    needs: select-domains
    if: needs.select-domains.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        domain: ${{ fromJson(needs.select-domains.outputs.domains) }}
      fail-fast: false # continue if any domain fails
      max-parallel: 5 # limit to 5 parallel jobs to avoid overwhelming resources

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Running update script - ${{ matrix.domain }}
        env:
          DOMAIN: ${{ matrix.domain }}
        run: |
          # Start from an empty directory so the only file that can be uploaded
          # is one this run actually fetched. A domain that fails uploads
          # nothing, and the commit job then leaves last week's data in place.
          rm -rf data/raw
          mkdir -p data/raw
          uv run python main.py -d "$DOMAIN" || echo "crt.sh lookup failed for $DOMAIN; keeping the previous file."
          ls -la data/raw/

      - name: Validate fetched file - ${{ matrix.domain }}
        env:
          DOMAIN: ${{ matrix.domain }}
        run: |
          file="data/raw/domain.${DOMAIN}.json"
          if [ ! -s "$file" ]; then
            echo "No data fetched for ${DOMAIN}; nothing to upload."
            exit 0
          fi
          # Refuse to publish a truncated or non-JSON body over good data.
          if ! python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(d, list) and d else 1)" "$file"; then
            echo "Fetched file for ${DOMAIN} is not a non-empty JSON list; discarding."
            rm -f "$file"
          fi

      - name: Upload raw data file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: raw-data-${{ matrix.domain }}
          path: data/raw/domain.${{ matrix.domain }}.json
          retention-days: 1
          if-no-files-found: ignore

      - name: Sleep for 20 seconds
        run: sleep 20

  commit-changes:
    needs: [select-domains, update-sites-raw]
    if: github.ref == 'refs/heads/main' && needs.select-domains.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download all raw data artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: raw-data-*
          merge-multiple: true
        # Errors when zero artifacts match, which is exactly the total-outage
        # case where we still want to leave the existing data untouched.
        continue-on-error: true

      - name: Overlay fetched files onto the checked-out data
        run: |
          # Deliberately NOT clearing data/raw first: only domains that were
          # fetched successfully get overwritten, so a domain crt.sh refused
          # this run keeps whatever it had rather than being deleted.
          mkdir -p data/raw artifacts
          cp -R artifacts/. data/raw/ 2>/dev/null || echo "No artifacts to overlay."

          echo "Files in data/raw:"
          ls -la data/raw/

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Record successful fetches
        run: |
          # Only domains that actually produced an artifact are stamped, so the
          # mid-week runs know exactly which ones still need another attempt.
          uv run python scripts/fetch_log.py --record artifacts
          cat data/raw/fetch-log.json | head -20

      - name: Commit and push changes
        run: |
          # Commit only the domains this run actually re-fetched, so a
          # concurrent job's writes to other domains are not reverted.
          ( cd artifacts && ls domain.*.json 2>/dev/null || true ) \
            | sed 's|^|data/raw/|' > /tmp/raw-paths.txt
          echo "data/raw/fetch-log.json" >> /tmp/raw-paths.txt
          cat /tmp/raw-paths.txt

          ./scripts/commit-and-push.sh \
            "Update of raw site changes - $(date +'%Y-%m-%d')" \
            --paths-from /tmp/raw-paths.txt

  call-convert-to-csv:
    needs: commit-changes
    uses: ./.github/workflows/convert_to_csv.yml
    permissions:
      contents: write
