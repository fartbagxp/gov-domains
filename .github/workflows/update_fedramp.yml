name: Update FedRAMP Marketplace Data - Daily

on:
  schedule:
    - cron: "0 9 * * *"  # Daily at 09:00 UTC, after FedRAMP's 2-3 AM ET upload
  workflow_dispatch:

concurrency:
  group: pipeline-fedramp
  cancel-in-progress: true

jobs:
  update-fedramp:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "latest"

      - name: Fetch FedRAMP Marketplace data
        run: |
          uv run python scripts/fetch_fedramp.py
          ls -la data/fedramp/

      - name: Commit and push changes
        if: github.ref == 'refs/heads/main'
        run: |
          ./scripts/commit-and-push.sh \
            "Daily FedRAMP Marketplace update - $(date +'%Y-%m-%d')" \
            data/fedramp/products.csv \
            data/fedramp/agencies.csv \
            data/fedramp/agency-authorizations.csv
